name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: majlis
          POSTGRES_PASSWORD: majlis
          POSTGRES_DB: majlis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U majlis" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://majlis:majlis@localhost:5432/majlis_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build API bundle
        run: pnpm --filter @majlis/api build
      - name: Build web
        run: pnpm --filter @majlis/web build
      - name: Bundle mobile (iOS + Android JS)
        run: pnpm --filter @majlis/mobile export:check
        env:
          CI: "1"
