# Fly.io config for the Majlis API + WebSocket gateway.
# Deploy from the repo root:  fly deploy --config apps/api/fly.toml
app = "majlis-api"

# Fly has no region inside Saudi Arabia. Frankfurt is the closest well-connected
# region (~80-120 ms to Riyadh/Jeddah) and matches Neon + Upstash eu-central-1.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs migrations once per release, before new machines take traffic.
  release_command = "node dist/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  WEB_URL = "https://majlis.app"
  CORS_ORIGINS = "https://majlis.app,https://www.majlis.app"

[http_service]
  internal_port = 8080
  force_https = true
  # Long-lived WebSockets: keep machines running, never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 5000
    hard_limit = 10000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
