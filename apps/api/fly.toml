# Fly.io config for the Majlis API + WebSocket gateway.
# Deploy from the repo root:  fly deploy --config apps/api/fly.toml --ha=false
# (single machine until Redis is added for multi-instance real-time fan-out)
app = "majlis-sa-api"

# Fly has no region inside Saudi Arabia. Frankfurt is the closest well-connected
# region (~80-120 ms to Riyadh/Jeddah) and matches Neon + Upstash eu-central-1.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs migrations once per release, before new machines take traffic.
  release_command = "node dist/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  PUBLIC_API_URL = "https://majlis-sa-api.fly.dev"
  WEB_URL = "https://majlis-web.fly.dev"
  CORS_ORIGINS = "https://majlis-web.fly.dev"
  # Fly's edge proxy appends the real client IP to X-Forwarded-For; trust exactly that one hop.
  TRUST_PROXY_HOPS = "1"
  # Files and course videos are stored in Cloudflare R2 (bucket "majlis-media",
  # location EEUR). Credentials are Fly secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
  # R2_SECRET_ACCESS_KEY, R2_BUCKET.
  # Payments. Teacher plans are sold on Majlis's own Whop account (secrets:
  # WHOP_API_KEY, WHOP_WEBHOOK_SECRET from `pnpm --filter @majlis/api whop:webhook`).
  # Students pay teachers' own Whop accounts; their pasted keys are encrypted
  # with WHOP_KEYS_ENCRYPTION_KEY (secret, `openssl rand -hex 32`).
  WHOP_ENV = "sandbox"
  WHOP_ACCOUNT_ID = "biz_ACFSypxxqX2KZZ"

[http_service]
  internal_port = 8080
  force_https = true
  # Long-lived WebSockets: keep the machine running, never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 5000
    hard_limit = 10000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
