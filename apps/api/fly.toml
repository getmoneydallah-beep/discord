# Fly.io config for the Majlis API + WebSocket gateway.
# Deploy from the repo root:  fly deploy --config apps/api/fly.toml --ha=false
app = "majlis-sa-api"

# Fly has no region inside Saudi Arabia. Frankfurt is the closest well-connected
# region (~80-120 ms to Riyadh/Jeddah) and matches Neon + Upstash eu-central-1.
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs migrations once per release, before new machines take traffic.
  release_command = "node dist/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  PUBLIC_API_URL = "https://majlis-sa-api.fly.dev"
  WEB_URL = "https://majlis-web.fly.dev"
  CORS_ORIGINS = "https://majlis-web.fly.dev"
  # Until Cloudflare R2 is configured, uploads live on the persistent volume below.
  # When adding R2_* secrets, remove these two lines and the [mounts] section.
  ALLOW_LOCAL_STORAGE = "true"
  STORAGE_DIR = "/data/uploads"

[mounts]
  source = "majlis_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Long-lived WebSockets: keep the machine running, never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 5000
    hard_limit = 10000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
